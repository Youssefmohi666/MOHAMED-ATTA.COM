<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="56" y1="64" x2="456" y2="448" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E3A8A"/>
      <stop offset="0.55" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#DC2626"/>
    </linearGradient>
    <linearGradient id="ring" x1="128" y1="120" x2="384" y2="392" gradientUnits="userSpaceOnUse">
      <stop stop-color="#93C5FD"/>
      <stop offset="1" stop-color="#FCA5A5"/>
    </linearGradient>
  </defs>

  <!-- Backing tile -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg)"/>

  <!-- Inner accent ring -->
  <circle cx="256" cy="256" r="156" fill="none" stroke="url(#ring)" stroke-width="10" opacity="0.55"/>

  <!-- Science motif: atom/flask hint - three orbiting arcs -->
  <g opacity="0.9" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" fill="none">
    <ellipse cx="256" cy="256" rx="120" ry="46" transform="rotate(0 256 256)"/>
    <ellipse cx="256" cy="256" rx="120" ry="46" transform="rotate(60 256 256)"/>
    <ellipse cx="256" cy="256" rx="120" ry="46" transform="rotate(120 256 256)"/>
  </g>

  <!-- Center nucleus -->
  <circle cx="256" cy="256" r="22" fill="#FFFFFF"/>

  <!-- Monogram: Arabic letter ʼAyn (ع) -->
  <path d="M256 336
           c-46 0 -80 -34 -80 -78
           c0 -44 34 -78 80 -78
           c46 0 80 34 80 78
           c0 22 -8 41 -22 56
           l-6 4
           c-10 -14 -16 -31 -16 -50
           c0 -23 18 -41 42 -41
           s42 18 42 41
           c0 36 -29 68 -66 68
           z"
        fill="#FFFFFF"/>
